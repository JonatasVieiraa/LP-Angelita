    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var videoContainer = document.getElementById('videoContainer');
        var videoWrapper = document.querySelector('.video-wrapper');
        var playButton = document.getElementById('playButton');
        var videoIframe = document.getElementById('videoIframe');

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('videoIframe', {
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            playButton.addEventListener('click', function (e) {
                e.stopPropagation();
                if (videoContainer.classList.contains('expanded')) {
                    player.playVideo();
                } else {
                    expandVideo();
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.ENDED) {
                shrinkVideo();
            }
        }

        function expandVideo() {
            videoContainer.classList.add('expanded');
            player.playVideo();
        }

        function shrinkVideo() {
            videoContainer.classList.remove('expanded');
            player.stopVideo();
        }

        // Adicionar evento para fechar o vídeo ao clicar fora dele
        videoContainer.addEventListener('click', function (event) {
            if (videoContainer.classList.contains('expanded') && !videoWrapper.contains(event.target)) {
                shrinkVideo();
            }
        });

        // Prevenir que cliques dentro do vídeo fechem ele
        videoWrapper.addEventListener('click', function (event) {
            event.stopPropagation();
        });
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const carouselSlide = document.querySelector('.carousel-container');
            const carouselImages = document.querySelectorAll('.carousel-slide');

            let counter = 0;
            const size = carouselImages[0].clientWidth;

            function slideCarousel() {
                if (counter >= carouselImages.length - 1) {
                    counter = -1;
                }
                counter++;
                carouselSlide.style.transform = 'translateX(' + (-size * counter) + 'px)';
            }

            setInterval(slideCarousel, 3000); // Change slide every 3 seconds
        });
    </script>

</body>
