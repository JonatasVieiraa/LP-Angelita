    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var videoContainer = document.getElementById('videoContainer');
        var videoWrapper = document.querySelector('.video-wrapper');
        var playButton = document.getElementById('playButton');
        var videoIframe = document.getElementById('videoIframe');

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('videoIframe', {
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            playButton.addEventListener('click', function (e) {
                e.stopPropagation();
                if (videoContainer.classList.contains('expanded')) {
                    player.playVideo();
                } else {
                    expandVideo();
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.ENDED) {
                shrinkVideo();
            }
        }

        function expandVideo() {
            videoContainer.classList.add('expanded');
            player.playVideo();
        }

        function shrinkVideo() {
            videoContainer.classList.remove('expanded');
            player.stopVideo();
        }

        // Adicionar evento para fechar o vídeo ao clicar fora dele
        videoContainer.addEventListener('click', function (event) {
            if (videoContainer.classList.contains('expanded') && !videoWrapper.contains(event.target)) {
                shrinkVideo();
            }
        });

        // Prevenir que cliques dentro do vídeo fechem ele
        videoWrapper.addEventListener('click', function (event) {
            event.stopPropagation();
        });
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const carouselContainer = document.querySelector('.carousel-container');
            const slides = document.querySelectorAll('.carousel-slide');
            const slideCount = 4; // Número de imagens únicas
            let currentIndex = 1;
            let startX;
            let isDragging = false;
            let startPos;

            // Adicionar indicadores
            const indicatorsContainer = document.createElement('div');
            indicatorsContainer.classList.add('carousel-indicators');
            for (let i = 0; i < slideCount; i++) {
                const indicator = document.createElement('div');
                indicator.classList.add('carousel-indicator');
                indicator.addEventListener('click', () => goToSlide(i));
                indicatorsContainer.appendChild(indicator);
            }
            document.querySelector('.carousel-section').appendChild(indicatorsContainer);

            function updateCarousel() {
                carouselContainer.style.transform = `translateX(-${currentIndex * 100}%)`;
                updateIndicators();
            }

            function updateIndicators() {
                const indicators = document.querySelectorAll('.carousel-indicator');
                indicators.forEach((indicator, index) => {
                    indicator.classList.toggle('active', index === currentIndex % slideCount);
                });
            }

            function goToSlide(index) {
                currentIndex = index + 1;
                updateCarousel();
            }

            function handleTransitionEnd() {
                if (currentIndex === 0) {
                    carouselContainer.style.transition = 'none';
                    currentIndex = slideCount;
                    carouselContainer.style.transform = `translateX(-${currentIndex * 100}%)`;
                    setTimeout(() => {
                        carouselContainer.style.transition = 'transform 0.3s ease-in-out';
                    }, 10);
                } else if (currentIndex === slides.length - 1) {
                    carouselContainer.style.transition = 'none';
                    currentIndex = 1;
                    carouselContainer.style.transform = `translateX(-${currentIndex * 100}%)`;
                    setTimeout(() => {
                        carouselContainer.style.transition = 'transform 0.3s ease-in-out';
                    }, 10);
                }
                updateIndicators();
            }

            function startDrag(e) {
                isDragging = true;
                startX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
                startPos = -currentIndex * 100;
                carouselContainer.style.transition = 'none';
            }

            function drag(e) {
                if (!isDragging) return;
                const currentX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
                const diff = (currentX - startX) / carouselContainer.offsetWidth * 100;
                carouselContainer.style.transform = `translateX(${startPos + diff}%)`;
            }

            function endDrag(e) {
                if (!isDragging) return;
                isDragging = false;
                const currentX = e.type === 'touchend' ? e.changedTouches[0].clientX : e.clientX;
                const diff = (currentX - startX) / carouselContainer.offsetWidth;

                if (Math.abs(diff) > 0.2) {
                    currentIndex += diff > 0 ? -1 : 1;
                }

                carouselContainer.style.transition = 'transform 0.3s ease-in-out';
                updateCarousel();
            }

            carouselContainer.addEventListener('transitionend', handleTransitionEnd);
            carouselContainer.addEventListener('mousedown', startDrag);
            carouselContainer.addEventListener('touchstart', startDrag);
            window.addEventListener('mousemove', drag);
            window.addEventListener('touchmove', drag);
            window.addEventListener('mouseup', endDrag);
            window.addEventListener('touchend', endDrag);

            // Iniciar o carrossel
            updateCarousel();

            // Avançar o carrossel automaticamente a cada 3 segundos
            setInterval(() => {
                currentIndex++;
                updateCarousel();
            }, 3000);
        });

    </script>
